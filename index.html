<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Universe | Ultimate Game Portal</title>
    <meta name="description" content="Play the best unblocked games online for free. Premium experience, no lag, ultimate fun.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg"></div>
    
    <header>
        <nav>
            <div class="logo">UNBLOCKED <span>UNIVERSE</span></div>
            <div class="search-container">
                <input type="text" id="game-search" placeholder="Search games...">
                <div class="search-icon">🔍</div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Level Up Your <span>Gaming</span></h1>
            <p>Access the most popular unblocked games with a premium interface.</p>
        </section>

        <section class="categories">
            <button class="cat-btn active" data-cat="all">All Games</button>
            <button class="cat-btn" data-cat="action">Action</button>
            <button class="cat-btn" data-cat="arcade">Arcade</button>
            <button class="cat-btn" data-cat="puzzle">Puzzle</button>
            <button class="cat-btn" data-cat="driving">Driving</button>
        </section>

        <section class="game-grid" id="game-grid">
            <!-- Games will be injected here by JS -->
        </section>
    </main>

    <div id="game-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="game-container"></div>
            <div class="game-info">
                <h2 id="modal-title">Game Title</h2>
                <button id="fullscreen-btn">Fullscreen</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Unblocked Universe. Created for GitHub Pages.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
