<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームのせかい | たのしくあそぼう！</title>
    <meta name="description" content="小学生でもかんたんにあそべるブラウザゲームがいっぱい！アクション、パズル、レースなど楽しいゲームがたくさん。">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
</head>
<body>
    <div class="glow-bg"></div>

    <header>
        <nav class="top-nav">
            <a class="logo" href="index.html">🎮 ゲームの<span>せかい</span></a>
            <div class="top-links">
                <a href="about.html">このサイトについて</a>
                <a href="privacy.html">プライバシー</a>
                <a href="contact.html">おといあわせ</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>🎮 ゲームのせかい</h1>
            <p class="subtitle">すきなゲームをえらんであそぼう！</p>
            <p class="hero-copy">ボタンをおすだけでゲームがはじまるよ。パソコンでもスマホでもあそべます！</p>
        </section>

        <section class="toolbar" aria-label="ゲームツール">
            <div class="search-container">
                <label for="game-search" class="sr-only">ゲームをさがす</label>
                <input type="text" id="game-search" placeholder="🔍 ゲームのなまえでさがす...">
            </div>
            <div class="categories" aria-label="ゲームのしゅるい">
                <button class="cat-btn active" data-cat="all">🌟 ぜんぶ</button>
                <button class="cat-btn" data-cat="action">⚡ アクション</button>
                <button class="cat-btn" data-cat="arcade">🕹️ アーケード</button>
                <button class="cat-btn" data-cat="puzzle">🧩 パズル</button>
                <button class="cat-btn" data-cat="driving">🏎️ レース</button>
            </div>
        </section>

        <section class="game-grid" id="game-grid" aria-live="polite"></section>
    </main>

    <div id="game-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-content">
            <button class="close-btn" id="close-modal" aria-label="ゲームをとじる">✕</button>
            <div id="game-container"></div>
            <div class="game-info">
                <div>
                    <h2 id="modal-title">ゲームのなまえ</h2>
                    <p id="modal-description"></p>
                </div>
                <div class="modal-actions">
                    <a id="open-tab-btn" class="ghost-btn" href="#" target="_blank" rel="noopener noreferrer">🔗 べつのページでひらく</a>
                    <button id="fullscreen-btn">📺 がめんいっぱい</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="about.html">このサイトについて</a>
            <a href="privacy.html">プライバシーポリシー</a>
            <a href="contact.html">おといあわせ</a>
        </div>
        <section class="support-section">
            <h2>🙏 おうえんしてね！</h2>
            <p>このサイトがたのしかったら、おうえんしてくれるとうれしいです。みんなのおうえんでサイトをつづけられます！</p>
            <a class="support-btn" href="https://ko-fi.com/" target="_blank" rel="noopener noreferrer">☕ おうえんする</a>
        </section>
        <p class="copyright">&copy; 2026 ゲームのせかい</p>
    </footer>

    <script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>
    <script>
        if (window.kofiWidgetOverlay) {
            kofiWidgetOverlay.draw('unblockeduniverse', {
                'type': 'floating-chat',
                'floating-chat.donateButton.text': 'おうえん',
                'floating-chat.donateButton.background-color': '#ff6b9d',
                'floating-chat.donateButton.text-color': '#fff'
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
