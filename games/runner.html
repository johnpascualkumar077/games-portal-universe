<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>エンドレスランナー</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #2a1a3e;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // --- Constants & State ---
  const LANE_COUNT = 3;
  const PLAYER_COLOR = '#ff69b4';
  const OBSTACLE_COLORS = ['#ff6347', '#ff8c00', '#32cd32', '#1e90ff'];
  const COIN_COLOR = '#ffd700';
  const BG_COLOR = '#2a1a3e';
  const GROUND_COLOR = '#3d2a5c';
  const STAR_COUNT = 60;

  let W, H;
  let laneWidth, laneY, laneCenters;
  let playerSize, obstacleW, obstacleH, coinRadius;
  let groundY;

  // Game state
  let state = 'start'; // start | playing | over
  let score = 0;
  let highScore = 0;
  let speed = 4;
  let baseSpeed = 4;
  let frame = 0;
  let lane = 1;
  let jumping = false;
  let jumpVel = 0;
  let jumpY = 0;
  let gravity = 0;
  let jumpStrength = 0;
  let obstacles = [];
  let coins = [];
  let particles = [];
  let stars = [];
  let nextSpawnDist = 0;
  let distTraveled = 0;
  let animId = null;

  // Touch
  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    groundY = H * 0.82;
    laneWidth = Math.min(W * 0.22, 120);
    playerSize = Math.min(laneWidth * 0.55, 50);
    obstacleW = laneWidth * 0.6;
    obstacleH = playerSize * 1.0;
    coinRadius = playerSize * 0.28;
    jumpStrength = H * 0.028;
    gravity = H * 0.0012;

    const totalLanesWidth = laneWidth * LANE_COUNT;
    const startX = (W - totalLanesWidth) / 2;
    laneCenters = [];
    for (let i = 0; i < LANE_COUNT; i++) {
      laneCenters[i] = startX + laneWidth * (i + 0.5);
    }

    // Generate stars
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * groundY * 0.9,
        r: Math.random() * 2 + 0.5,
        twinkle: Math.random() * Math.PI * 2
      });
    }
  }

  function resetGame() {
    score = 0;
    speed = baseSpeed;
    frame = 0;
    lane = 1;
    jumping = false;
    jumpVel = 0;
    jumpY = 0;
    obstacles = [];
    coins = [];
    particles = [];
    nextSpawnDist = 0;
    distTraveled = 0;
  }

  // --- Spawning ---
  function spawnRow() {
    const types = [];
    // Always leave at least one lane free
    const blockedCount = Math.random() < 0.3 ? 2 : 1;
    const blocked = new Set();
    while (blocked.size < blockedCount) {
      blocked.add(Math.floor(Math.random() * LANE_COUNT));
    }

    for (let i = 0; i < LANE_COUNT; i++) {
      if (blocked.has(i)) {
        types.push('obstacle');
      } else if (Math.random() < 0.5) {
        types.push('coin');
      } else {
        types.push(null);
      }
    }

    for (let i = 0; i < LANE_COUNT; i++) {
      const x = laneCenters[i];
      const y = -obstacleH;
      if (types[i] === 'obstacle') {
        obstacles.push({
          x: x,
          y: y,
          w: obstacleW,
          h: obstacleH,
          color: OBSTACLE_COLORS[Math.floor(Math.random() * OBSTACLE_COLORS.length)]
        });
      } else if (types[i] === 'coin') {
        coins.push({
          x: x,
          y: y,
          r: coinRadius,
          collected: false
        });
      }
    }
  }

  // --- Particles ---
  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        life: 1,
        color: color,
        r: Math.random() * 4 + 2
      });
    }
  }

  // --- Collision ---
  function playerBox() {
    const px = laneCenters[lane];
    const py = groundY - playerSize - jumpY;
    return {
      x: px - playerSize / 2 + 4,
      y: py + 4,
      w: playerSize - 8,
      h: playerSize - 8
    };
  }

  function rectsOverlap(a, bx, by, bw, bh) {
    return a.x < bx + bw && a.x + a.w > bx && a.y < by + bh && a.y + a.h > by;
  }

  // --- Input ---
  function changeLane(dir) {
    if (state === 'playing') {
      lane = Math.max(0, Math.min(LANE_COUNT - 1, lane + dir));
    }
  }

  function jump() {
    if (state === 'playing' && !jumping) {
      jumping = true;
      jumpVel = jumpStrength;
    }
  }

  function startOrRetry() {
    if (state === 'start' || state === 'over') {
      resetGame();
      state = 'playing';
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); changeLane(-1); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); changeLane(1); }
    if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') { e.preventDefault(); jump(); }
    if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); startOrRetry(); }
  });

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = Date.now();
  }, { passive: false });

  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (state !== 'playing') {
      startOrRetry();
      return;
    }
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const dt = Date.now() - touchStartTime;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 20 && dt < 300) {
      jump();
    } else if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
      changeLane(dx > 0 ? 1 : -1);
    } else if (dy < -30) {
      jump();
    }
  }, { passive: false });

  canvas.addEventListener('click', function() {
    startOrRetry();
  });

  // --- Drawing ---
  function drawRoundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawBackground() {
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let s of stars) {
      const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle + frame * 0.02));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Ground
    ctx.fillStyle = GROUND_COLOR;
    ctx.fillRect(0, groundY, W, H - groundY);

    // Lane lines
    const totalLanesWidth = laneWidth * LANE_COUNT;
    const startX = (W - totalLanesWidth) / 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    for (let i = 0; i <= LANE_COUNT; i++) {
      const lx = startX + laneWidth * i;
      ctx.beginPath();
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, groundY);
      ctx.stroke();
    }

    // Road dashes (scrolling)
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    ctx.setLineDash([20, 20]);
    const dashOffset = (distTraveled * 3) % 40;
    ctx.lineDashOffset = -dashOffset;
    for (let i = 1; i < LANE_COUNT; i++) {
      const lx = startX + laneWidth * i;
      ctx.beginPath();
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, groundY);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function drawPlayer() {
    const px = laneCenters[lane];
    const py = groundY - playerSize - jumpY;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(px, groundY - 2, playerSize * 0.4, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = PLAYER_COLOR;
    drawRoundRect(px - playerSize / 2, py, playerSize, playerSize, 8);
    ctx.fill();

    // Face
    const eyeSize = playerSize * 0.1;
    const eyeY = py + playerSize * 0.35;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px - playerSize * 0.18, eyeY, eyeSize + 2, 0, Math.PI * 2);
    ctx.arc(px + playerSize * 0.18, eyeY, eyeSize + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(px - playerSize * 0.18, eyeY, eyeSize, 0, Math.PI * 2);
    ctx.arc(px + playerSize * 0.18, eyeY, eyeSize, 0, Math.PI * 2);
    ctx.fill();

    // Smile
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py + playerSize * 0.55, playerSize * 0.15, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
  }

  function drawObstacles() {
    for (let o of obstacles) {
      ctx.fillStyle = o.color;
      drawRoundRect(o.x - o.w / 2, o.y, o.w, o.h, 6);
      ctx.fill();

      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      drawRoundRect(o.x - o.w / 2 + 4, o.y + 4, o.w - 8, o.h * 0.35, 4);
      ctx.fill();

      // X mark
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 3;
      const cx = o.x;
      const cy = o.y + o.h / 2;
      const s = Math.min(o.w, o.h) * 0.2;
      ctx.beginPath();
      ctx.moveTo(cx - s, cy - s);
      ctx.lineTo(cx + s, cy + s);
      ctx.moveTo(cx + s, cy - s);
      ctx.lineTo(cx - s, cy + s);
      ctx.stroke();
    }
  }

  function drawCoins() {
    for (let c of coins) {
      if (c.collected) continue;
      // Glow
      ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r * 2, 0, Math.PI * 2);
      ctx.fill();

      // Coin body
      ctx.fillStyle = COIN_COLOR;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fill();

      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(c.x - c.r * 0.25, c.y - c.r * 0.25, c.r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles() {
    for (let p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    // Score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.max(18, W * 0.04) + 'px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('スコア: ' + score, 16, 16);

    if (highScore > 0) {
      ctx.font = Math.max(14, W * 0.025) + 'px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('さいこう: ' + highScore, 16, 16 + Math.max(22, W * 0.05));
    }
  }

  function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#ff69b4';
    ctx.font = 'bold ' + Math.max(28, W * 0.07) + 'px sans-serif';
    ctx.fillText('エンドレスランナー', W / 2, H * 0.35);

    ctx.fillStyle = '#ffd700';
    ctx.font = Math.max(16, W * 0.035) + 'px sans-serif';
    ctx.fillText('← → でいどう　スペースでジャンプ', W / 2, H * 0.48);

    const pulse = 0.7 + 0.3 * Math.sin(frame * 0.06);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.max(20, W * 0.045) + 'px sans-serif';
    ctx.fillText('タップではじめよう', W / 2, H * 0.6);
    ctx.globalAlpha = 1;
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#ff6347';
    ctx.font = 'bold ' + Math.max(32, W * 0.08) + 'px sans-serif';
    ctx.fillText('ゲームオーバー', W / 2, H * 0.32);

    ctx.fillStyle = '#fff';
    ctx.font = Math.max(20, W * 0.045) + 'px sans-serif';
    ctx.fillText('スコア: ' + score, W / 2, H * 0.44);

    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#ffd700';
      ctx.font = Math.max(16, W * 0.035) + 'px sans-serif';
      ctx.fillText('あたらしいきろく!', W / 2, H * 0.52);
    }

    const pulse = 0.7 + 0.3 * Math.sin(frame * 0.06);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#32cd32';
    ctx.font = 'bold ' + Math.max(20, W * 0.045) + 'px sans-serif';
    ctx.fillText('もういちどあそぶ', W / 2, H * 0.64);
    ctx.globalAlpha = 1;
  }

  // --- Update ---
  function update() {
    if (state !== 'playing') return;

    frame++;
    speed = baseSpeed + frame * 0.002;
    distTraveled += speed;

    // Spawn
    nextSpawnDist -= speed;
    if (nextSpawnDist <= 0) {
      spawnRow();
      nextSpawnDist = Math.max(playerSize * 2.5, 180 - frame * 0.1);
    }

    // Jump
    if (jumping) {
      jumpY += jumpVel;
      jumpVel -= gravity;
      if (jumpY <= 0) {
        jumpY = 0;
        jumpVel = 0;
        jumping = false;
      }
    }

    // Move obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].y += speed;
      if (obstacles[i].y > H + 50) {
        obstacles.splice(i, 1);
        score++;
      }
    }

    // Move coins
    for (let i = coins.length - 1; i >= 0; i--) {
      coins[i].y += speed;
      if (coins[i].y > H + 50) {
        coins.splice(i, 1);
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.03;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Collision - obstacles
    const pb = playerBox();
    for (let o of obstacles) {
      if (rectsOverlap(pb, o.x - o.w / 2, o.y, o.w, o.h)) {
        // Game over
        spawnParticles(pb.x + pb.w / 2, pb.y + pb.h / 2, '#ff69b4', 20);
        if (score > highScore) highScore = score;
        state = 'over';
        return;
      }
    }

    // Collision - coins
    for (let c of coins) {
      if (c.collected) continue;
      const cdx = (pb.x + pb.w / 2) - c.x;
      const cdy = (pb.y + pb.h / 2) - c.y;
      const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
      if (cdist < c.r + pb.w / 2) {
        c.collected = true;
        score += 5;
        spawnParticles(c.x, c.y, COIN_COLOR, 8);
      }
    }
  }

  // --- Main Loop ---
  function loop() {
    update();

    drawBackground();
    drawObstacles();
    drawCoins();
    drawParticles();
    if (state === 'playing' || state === 'over') {
      drawPlayer();
    }
    drawHUD();

    if (state === 'start') drawStartScreen();
    if (state === 'over') drawGameOver();

    frame++;
    animId = requestAnimationFrame(loop);
  }

  // --- Init ---
  window.addEventListener('resize', resize);
  resize();
  loop();

})();
</script>
</body>
</html>
